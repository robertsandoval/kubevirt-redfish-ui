{{- if and .Values.plugin.jobs.patchConsoles.enabled .Values.plugin.patcherServiceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubevirt-hosts.patcherServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-hosts.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.plugin.patcherServiceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
