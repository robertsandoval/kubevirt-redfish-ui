apiVersion: v1
kind: Service
metadata:
  {{- if not .Values.plugin.certificateSecretName }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "kubevirt-hosts.certificateSecret" . }}
  {{- end }}
  name: {{ include "kubevirt-hosts.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-hosts.labels" . | nindent 4 }}
spec:
  ports:
    - name: {{ .Values.plugin.port }}-tcp
      protocol: TCP
      port: {{ .Values.plugin.port }}
      targetPort: {{ .Values.plugin.port }}
  selector:
    {{- include "kubevirt-hosts.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  sessionAffinity: None
